<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Nueva Contraseña - Compita</title>
    <link rel="icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo y título -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center gap-2 mb-2">
                <span class="text-4xl">🎯</span>
                <span class="text-3xl font-bold text-gray-800">Compita</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Crear nueva contraseña</h1>
            <p class="text-gray-600">Ingresa tu nueva contraseña</p>
        </div>

        <!-- Formulario -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <form id="form-resetear" onsubmit="resetearPassword(event)">
                <!-- Contraseña Nueva -->
                <div class="mb-4">
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                        Nueva Contraseña
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        required
                        minlength="8"
                        class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-indigo-600 focus:outline-none transition"
                        placeholder="Mínimo 8 caracteres"
                    >
                </div>

                <!-- Confirmar Contraseña -->
                <div class="mb-6">
                    <label for="password-confirm" class="block text-sm font-semibold text-gray-700 mb-2">
                        Confirmar Contraseña
                    </label>
                    <input 
                        type="password" 
                        id="password-confirm" 
                        name="password-confirm"
                        required
                        minlength="8"
                        class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-indigo-600 focus:outline-none transition"
                        placeholder="Repite tu contraseña"
                    >
                    <p class="text-xs text-gray-500 mt-2">
                        Ambas contraseñas deben coincidir
                    </p>
                </div>

                <!-- Botón Submit -->
                <button 
                    type="submit" 
                    id="btn-submit"
                    class="w-full bg-indigo-600 text-white px-6 py-4 rounded-lg hover:bg-indigo-700 transition font-semibold text-lg shadow-lg hover:shadow-xl"
                >
                    <span id="btn-text">Cambiar Contraseña</span>
                    <span id="btn-loading" class="hidden">
                        <svg class="animate-spin h-5 w-5 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </span>
                </button>

                <!-- Mensaje de éxito -->
                <div id="mensaje-exito" class="hidden mt-4 p-4 bg-green-50 border border-green-200 rounded-lg">
                    <p class="text-green-800 font-semibold mb-2">✅ ¡Contraseña actualizada!</p>
                    <p class="text-green-700 text-sm mb-3">
                        Tu contraseña ha sido cambiada exitosamente.
                    </p>
                    <a href="/login.html" class="inline-block bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition font-semibold text-sm">
                        Ir a Login
                    </a>
                </div>

                <!-- Mensaje de error -->
                <div id="mensaje-error" class="hidden mt-4 p-4 bg-red-50 border border-red-200 rounded-lg">
                    <p class="text-red-800 font-semibold">❌ Error</p>
                    <p id="error-texto" class="text-red-700 text-sm mt-1"></p>
                </div>
            </form>
        </div>

        <!-- Link de ayuda -->
        <div class="text-center mt-6">
            <a href="/recuperar-password.html" class="text-sm text-gray-600 hover:text-gray-800 transition">
                ¿Link expirado? Solicita uno nuevo
            </a>
        </div>
    </div>

    <script>
        let token = null;

        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            token = urlParams.get('token');

            if (!token) {
                mostrarError('Token de recuperación no encontrado. Solicita uno nuevo.');
                document.getElementById('btn-submit').disabled = true;
            }
        });

        async function resetearPassword(event) {
            event.preventDefault();
            
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password-confirm').value;

            // Validar que las contraseñas coincidan
            if (password !== passwordConfirm) {
                mostrarError('Las contraseñas no coinciden');
                return;
            }

            // Validar longitud
            if (password.length < 8) {
                mostrarError('La contraseña debe tener al menos 8 caracteres');
                return;
            }

            // Mostrar loading
            mostrarLoading(true);
            ocultarMensajes();

            try {
                const response = await fetch('/api/resetear-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token,
                        password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    mostrarExito();
                    // Limpiar el formulario
                    document.getElementById('form-resetear').reset();
                } else {
                    mostrarError(data.error || 'Error al cambiar contraseña');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarError('Error de conexión. Verifica tu internet.');
            } finally {
                mostrarLoading(false);
            }
        }

        function mostrarLoading(mostrar) {
            const btnText = document.getElementById('btn-text');
            const btnLoading = document.getElementById('btn-loading');
            const btnSubmit = document.getElementById('btn-submit');
            
            if (mostrar) {
                btnText.classList.add('hidden');
                btnLoading.classList.remove('hidden');
                btnSubmit.disabled = true;
            } else {
                btnText.classList.remove('hidden');
                btnLoading.classList.add('hidden');
                btnSubmit.disabled = false;
            }
        }

        function mostrarExito() {
            document.getElementById('mensaje-exito').classList.remove('hidden');
        }

        function mostrarError(mensaje) {
            const errorDiv = document.getElementById('mensaje-error');
            const errorTexto = document.getElementById('error-texto');
            
            errorTexto.textContent = mensaje;
            errorDiv.classList.remove('hidden');
        }

        function ocultarMensajes() {
            document.getElementById('mensaje-exito').classList.add('hidden');
            document.getElementById('mensaje-error').classList.add('hidden');
        }
    </script>
</body>
</html>
