name: Backfill Precios Históricos

on:
  workflow_dispatch:
    inputs:
      etapa:
        description: 'Etapa a ejecutar: parsear'
        required: false
        default: 'parsear'
      lote_size:
        description: 'PDFs a procesar en este lote'
        required: false
        default: '100'

jobs:
  backfill:
    name: Parsear ofertas económicas
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install pypdf psycopg2-binary requests

      - name: Parsear PDFs con Claude
        env:
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOTE_SIZE:         ${{ github.event.inputs.lote_size || '100' }}
        run: python backfill_parsear.py