name: Análisis y Notificaciones Diarias
on:
  schedule:
    - cron: '0 18 * * 1-5'   # 2:00 PM AST (6:00 PM UTC), Lunes a Viernes
    - cron: '30 21 * * 1-5'  # 5:30 PM AST (9:30 PM UTC), Lunes a Viernes
  workflow_dispatch:  # Permite ejecución manual

jobs:
  analizar-y-notificar:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔍 Ejecutar análisis y notificaciones
        run: |
          echo "🚀 Iniciando análisis y notificaciones..."
          
          response=$(curl -X POST https://compita.umbusk.com/api/analizar-notificar-v2 \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP_CODE:%{http_code}" \
            -s)
          
          http_code=$(echo "$response" | grep "HTTP_CODE" | cut -d':' -f2)
          body=$(echo "$response" | sed '$d')
          
          echo "$body"
          
          if [ "$http_code" != "200" ]; then
            echo "❌ Error: HTTP $http_code"
            exit 1
          fi
          
          echo "✅ Proceso completado exitosamente"
      
      - name: 📊 Resultado
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ Workflow completado"
          else
            echo "❌ Workflow falló"
          fi