name: Diagnóstico de reportes sectoriales
# Solo lectura: muestra cómo quedó clasificada una institución en un sector.
# Se ejecuta al cambiar .github/pruebas/diagnostico-reportes.json
on:
  push:
    paths:
      - ".github/pruebas/diagnostico-reportes.json"
  workflow_dispatch:
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python diagnostico_reportes.py
