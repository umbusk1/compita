<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Admin Compita</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-YBQQM365Q8"></script>
	<script>
	  window.dataLayer = window.dataLayer || [];
	  function gtag(){dataLayer.push(arguments);}
	  gtag('js', new Date());

	  gtag('config', 'G-YBQQM365Q8');
    </script>

</head>
<body class="bg-gradient-to-br from-indigo-500 to-purple-600 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <!-- Logo y Título -->
        <div class="text-center mb-8">
            <div class="inline-block bg-indigo-100 p-4 rounded-full mb-4">
                <span class="text-4xl">🔑</span>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Recuperar Contraseña</h1>
            <p class="text-gray-600">Ingresa tu email de administrador</p>
        </div>

        <!-- Contenido dinámico -->
        <div id="form-container">
            <!-- Formulario -->
            <form id="reset-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email de Administrador</label>
                    <input
                        type="email"
                        id="email"
                        required
                        placeholder="admin@ejemplo.com"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition"
                    >
                </div>

                <!-- Mensaje de error -->
                <div id="error-message" class="hidden bg-red-50 border border-red-200 rounded-lg p-4">
                    <p class="text-red-800 text-sm font-medium">❌ <span id="error-text"></span></p>
                </div>

                <!-- Botón -->
                <button
                    type="submit"
                    id="submit-btn"
                    class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition font-semibold text-lg shadow-lg hover:shadow-xl"
                >
                    Enviar Link de Recuperación
                </button>
            </form>
        </div>

        <!-- Mensaje de éxito (oculto inicialmente) -->
        <div id="success-container" class="hidden">
            <div class="bg-green-50 border border-green-200 rounded-lg p-6 mb-6">
                <div class="text-center mb-4">
                    <span class="text-5xl">📧</span>
                </div>
                <h3 class="text-xl font-bold text-green-900 mb-2 text-center">¡Email Enviado!</h3>
                <p class="text-green-800 text-sm text-center">
                    Si el email existe en nuestro sistema, recibirás un link de recuperación en los próximos minutos.
                </p>
            </div>
            <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6">
                <p class="text-yellow-800 text-sm">
                    <strong>⏰ Importante:</strong> El link expira en 1 hora y solo puede ser usado una vez.
                </p>
            </div>
            <a href="/admin-login.html" class="block w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition font-semibold text-center">
                Volver al Login
            </a>
        </div>

        <!-- Divider -->
        <div class="mt-8 pt-6 border-t border-gray-200 text-center">
            <a href="/admin-login.html" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium">
                ← Volver al login
            </a>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        document.getElementById('reset-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const formContainer = document.getElementById('form-container');
            const successContainer = document.getElementById('success-container');

            // Deshabilitar botón
            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando...';
            errorDiv.classList.add('hidden');

            try {
                const email = document.getElementById('email').value;

                const response = await fetch(`${API_BASE}/api/password?action=request-reset-admin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    // Mostrar mensaje de éxito
                    formContainer.classList.add('hidden');
                    successContainer.classList.remove('hidden');
                } else {
                    // Mostrar error
                    errorText.textContent = data.error || 'Error al procesar solicitud';
                    errorDiv.classList.remove('hidden');

                    // Habilitar botón
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Enviar Link de Recuperación';
                }
            } catch (error) {
                console.error('Error:', error);
                errorText.textContent = 'Error de conexión. Intenta nuevamente.';
                errorDiv.classList.remove('hidden');

                submitBtn.disabled = false;
                submitBtn.textContent = 'Enviar Link de Recuperación';
            }
        });
    </script>
</body>
</html>
