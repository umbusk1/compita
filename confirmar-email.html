<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Email - Compita</title>
    <link rel="icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center gap-2 mb-4">
                <span class="text-4xl">🎯</span>
                <span class="text-3xl font-bold text-gray-800">Compita</span>
            </div>
        </div>

        <!-- Card de loading -->
        <div id="loading-card" class="bg-white rounded-2xl shadow-xl p-8 text-center">
            <div class="text-6xl mb-4">⏳</div>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Confirmando tu email...</h1>
            <p class="text-gray-600">Por favor espera un momento</p>
            <div class="mt-6">
                <svg class="animate-spin h-8 w-8 mx-auto text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
        </div>

        <!-- Card de éxito -->
        <div id="exito-card" class="hidden bg-white rounded-2xl shadow-xl p-8 text-center">
            <div class="text-6xl mb-4">✅</div>
            <h1 class="text-2xl font-bold text-green-700 mb-2">¡Email confirmado!</h1>
            <p class="text-gray-600 mb-6">Tu cuenta ha sido activada exitosamente.</p>
            <a href="/login.html" class="inline-block bg-indigo-600 text-white px-8 py-3 rounded-lg hover:bg-indigo-700 transition font-semibold">
                Ir a Login
            </a>
        </div>

        <!-- Card de ya confirmado -->
        <div id="ya-confirmado-card" class="hidden bg-white rounded-2xl shadow-xl p-8 text-center">
            <div class="text-6xl mb-4">ℹ️</div>
            <h1 class="text-2xl font-bold text-blue-700 mb-2">Email ya confirmado</h1>
            <p class="text-gray-600 mb-6">Este email ya había sido confirmado anteriormente.</p>
            <a href="/login.html" class="inline-block bg-indigo-600 text-white px-8 py-3 rounded-lg hover:bg-indigo-700 transition font-semibold">
                Ir a Login
            </a>
        </div>

        <!-- Card de error -->
        <div id="error-card" class="hidden bg-white rounded-2xl shadow-xl p-8 text-center">
            <div class="text-6xl mb-4">❌</div>
            <h1 class="text-2xl font-bold text-red-700 mb-2">Error de confirmación</h1>
            <p id="error-mensaje" class="text-gray-600 mb-6"></p>
            <div class="space-y-3">
                <a href="/login.html" class="block bg-indigo-600 text-white px-8 py-3 rounded-lg hover:bg-indigo-700 transition font-semibold">
                    Ir a Login
                </a>
                <a href="/registro.html" class="block text-indigo-600 hover:text-indigo-800 font-semibold">
                    Registrarse de nuevo
                </a>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                mostrarError('Token de confirmación no encontrado');
                return;
            }

            try {
                const response = await fetch(`/api/confirmar-email?token=${encodeURIComponent(token)}`);
                const data = await response.json();

                if (response.ok) {
                    if (data.ya_confirmado) {
                        mostrarYaConfirmado();
                    } else {
                        mostrarExito();
                    }
                } else {
                    mostrarError(data.error || 'Error al confirmar email');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarError('Error de conexión. Verifica tu internet.');
            }
        });

        function mostrarExito() {
            document.getElementById('loading-card').classList.add('hidden');
            document.getElementById('exito-card').classList.remove('hidden');
        }

        function mostrarYaConfirmado() {
            document.getElementById('loading-card').classList.add('hidden');
            document.getElementById('ya-confirmado-card').classList.remove('hidden');
        }

        function mostrarError(mensaje) {
            document.getElementById('loading-card').classList.add('hidden');
            document.getElementById('error-mensaje').textContent = mensaje;
            document.getElementById('error-card').classList.remove('hidden');
        }
    </script>
</body>
</html>
