<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compita - Sistema de Análisis de Licitaciones</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
        }
        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            background: transparent;
            font-size: 1.1em;
            font-weight: 600;
            color: #6c757d;
        }
        .tab:hover { background: #e9ecef; }
        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }
        .tab-content { display: none; padding: 30px; }
        .tab-content.active { display: block; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
            margin: 5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .keyword-counter {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-left: 10px;
        }
        .keyword-counter.green { background: #d4edda; color: #155724; }
        .keyword-counter.yellow { background: #fff3cd; color: #856404; }
        .keyword-counter.red { background: #f8d7da; color: #721c24; }
        .clientes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .cliente-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #dee2e6;
            transition: all 0.3s;
        }
        .cliente-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .cliente-card h3 { color: #667eea; margin-bottom: 10px; }
        .table-container { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #495057;
        }
        tr:hover { background: #f8f9fa; }
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .badge-alta { background: #28a745; color: white; }
        .badge-media { background: #ffc107; color: #212529; }
        .badge-baja { background: #6c757d; color: white; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-card h3 { font-size: 2em; margin-bottom: 5px; }
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        .chip {
            display: inline-block;
            padding: 6px 12px;
            background: #e7f1ff;
            color: #667eea;
            border-radius: 20px;
            margin: 4px;
            font-size: 0.9em;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .progress-container {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px solid #dee2e6;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        .progress-stage {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 8px;
        }
        .progress-stage h4 {
            color: #667eea;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Compita</h1>
            <p>Sistema de Análisis de Licitaciones con IA</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="cambiarTab('clientes')">👥 Clientes</button>
            <button class="tab" onclick="cambiarTab('analizar')">🔍 Analizar</button>
            <button class="tab" onclick="cambiarTab('resultados')">📊 Resultados</button>
        </div>

        <!-- TAB 1: CLIENTES -->
        <div id="tab-clientes" class="tab-content active">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <h2>Gestión de Clientes</h2>
                <button class="btn btn-primary" onclick="mostrarModalCliente()">+ Nuevo Cliente</button>
            </div>
            <div id="clientes-container" class="clientes-grid">
                <div class="loading">Cargando clientes...</div>
            </div>
        </div>

        <!-- TAB 2: ANALIZAR -->
        <div id="tab-analizar" class="tab-content">
            <h2>Analizar Licitaciones</h2>
            <div class="form-group">
                <label>Seleccionar Cliente</label>
                <select id="select-cliente"><option value="">Seleccione...</option></select>
            </div>
            <div class="form-group">
                <label>📁 Archivo Excel (descripciones en columna C)</label>
                <input type="file" id="file-input" accept=".xlsx,.xls">
            </div>
            <button class="btn btn-primary" onclick="analizarLicitaciones()">🚀 Analizar</button>
            <div id="analisis-status"></div>
        </div>

        <!-- TAB 3: RESULTADOS -->
        <div id="tab-resultados" class="tab-content">
            <h2>Resultados</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <select id="filtro-cliente" onchange="cargarResultados()">
                    <option value="">Todos los clientes</option>
                </select>
                <select id="filtro-relevancia" onchange="cargarResultados()">
                    <option value="">Todas</option>
                    <option value="ALTA">ALTA</option>
                    <option value="MEDIA">MEDIA</option>
                    <option value="BAJA">BAJA</option>
                </select>
                <button class="btn btn-success" onclick="exportarSeleccionados()">📥 Exportar</button>
            </div>
            <div id="resultados-stats" class="stats"></div>
            <div id="resultados-container"></div>
        </div>
    </div>

    <!-- MODAL CLIENTE -->
    <div id="modal-cliente" class="modal">
        <div class="modal-content">
            <h2 id="modal-titulo">Nuevo Cliente</h2>
            <form id="form-cliente" onsubmit="guardarCliente(event)">
                <input type="hidden" id="cliente-id">
                <div class="form-group">
                    <label>Nombre *</label>
                    <input type="text" id="cliente-nombre" required>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="cliente-descripcion" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Criterios ALTA (separados por coma)</label>
                    <textarea id="cliente-alta" rows="3" oninput="actualizarContadores()" placeholder="capacitación, diplomados, talleres..."></textarea>
                    <small style="color: #6c757d;">💡 1-15 palabras específicas de tu negocio</small>
                </div>
                <div class="form-group">
                    <label>Criterios MEDIA (separados por coma)</label>
                    <textarea id="cliente-media" rows="3" oninput="actualizarContadores()" placeholder="consultoría, asesoría..."></textarea>
                    <small style="color: #6c757d;">💡 10-20 palabras relacionadas</small>
                </div>
                <div class="form-group">
                    <label>Exclusiones - Opcional (separados por coma)</label>
                    <textarea id="cliente-exclusiones" rows="2" oninput="actualizarContadores()" placeholder="construcción, materiales, alimentos..."></textarea>
                    <small style="color: #6c757d;">💡 5-15 palabras para descartar automáticamente</small>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-success">💾 Guardar</button>
                    <button type="button" class="btn btn-secondary" onclick="cerrarModalCliente()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        let clientes = [];
        let resultadosActuales = [];

        window.onload = () => cargarClientes();

        function cambiarTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
            if (tab === 'resultados') cargarResultados();
        }

        async function cargarClientes() {
            try {
                const response = await fetch(`${API_BASE}/clientes`);
                const data = await response.json();
                if (data.success) {
                    clientes = data.clientes;
                    mostrarClientes();
                    actualizarSelectsClientes();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function mostrarClientes() {
            const container = document.getElementById('clientes-container');
            if (clientes.length === 0) {
                container.innerHTML = '<p>No hay clientes</p>';
                return;
            }
            container.innerHTML = clientes.map(c => `
                <div class="cliente-card">
                    <h3>${c.nombre}</h3>
                    <p>${c.descripcion || 'Sin descripción'}</p>
                    <div style="margin-top: 10px;">
                        <strong>ALTA:</strong> ${(c.criterios_alta || []).slice(0, 3).map(cr => `<span class="chip">${cr}</span>`).join('')}
                        ${c.criterios_alta && c.criterios_alta.length > 3 ? `<span class="chip">+${c.criterios_alta.length - 3}</span>` : ''}
                    </div>
                    ${c.exclusiones && c.exclusiones.length > 0 ? `
                    <div style="margin-top: 10px;">
                        <strong>Exclusiones:</strong> ${c.exclusiones.slice(0, 2).map(ex => `<span class="chip" style="background: #f8d7da">${ex}</span>`).join('')}
                    </div>` : ''}
                    <div style="margin-top: 15px;">
                        <button class="btn btn-secondary" onclick="editarCliente(${c.id})">✏️</button>
                        <button class="btn btn-danger" onclick="eliminarCliente(${c.id})">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function actualizarSelectsClientes() {
            [document.getElementById('select-cliente'), document.getElementById('filtro-cliente')].forEach(select => {
                if (select) select.innerHTML = '<option value="">Seleccione...</option>' +
                    clientes.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
            });
        }

        function contarPalabras(texto) {
            return texto ? texto.split(',').map(s => s.trim()).filter(s => s).length : 0;
        }

        function actualizarContadores() {
            ['alta', 'media', 'exclusiones'].forEach(campo => {
                const textarea = document.getElementById(`cliente-${campo}`);
                const label = textarea.previousElementSibling;
                const oldCounter = label.querySelector('.keyword-counter');
                if (oldCounter) oldCounter.remove();

                const count = contarPalabras(textarea.value);
                if (count > 0) {
                    let clase = 'green', texto = 'Excelente';
                    if (count >= 16 && count <= 25) { clase = 'yellow'; texto = 'Aceptable'; }
                    else if (count > 25) { clase = 'red'; texto = 'Considera reducir'; }

                    const counter = document.createElement('span');
                    counter.className = `keyword-counter ${clase}`;
                    counter.textContent = `${count} palabras - ${texto}`;
                    label.appendChild(counter);
                }
            });
        }

        function mostrarModalCliente(clienteId = null) {
            document.getElementById('modal-cliente').classList.add('active');
            document.getElementById('form-cliente').reset();

            if (clienteId) {
                const cliente = clientes.find(c => c.id === clienteId);
                if (cliente) {
                    document.getElementById('modal-titulo').textContent = 'Editar Cliente';
                    document.getElementById('cliente-id').value = cliente.id;
                    document.getElementById('cliente-nombre').value = cliente.nombre;
                    document.getElementById('cliente-descripcion').value = cliente.descripcion || '';
                    document.getElementById('cliente-alta').value = (cliente.criterios_alta || []).join(', ');
                    document.getElementById('cliente-media').value = (cliente.criterios_media || []).join(', ');
                    document.getElementById('cliente-exclusiones').value = (cliente.exclusiones || []).join(', ');
                }
            } else {
                document.getElementById('modal-titulo').textContent = 'Nuevo Cliente';
            }
            setTimeout(actualizarContadores, 100);
        }

        function cerrarModalCliente() {
            document.getElementById('modal-cliente').classList.remove('active');
        }

        async function guardarCliente(event) {
            event.preventDefault();
            const id = document.getElementById('cliente-id').value;
            const datos = {
                nombre: document.getElementById('cliente-nombre').value,
                descripcion: document.getElementById('cliente-descripcion').value,
                criterios_alta: document.getElementById('cliente-alta').value.split(',').map(s => s.trim()).filter(s => s),
                criterios_media: document.getElementById('cliente-media').value.split(',').map(s => s.trim()).filter(s => s),
                exclusiones: document.getElementById('cliente-exclusiones').value.split(',').map(s => s.trim()).filter(s => s)
            };

            if (datos.criterios_alta.length === 0 && datos.criterios_media.length === 0) {
                alert('Debe especificar al menos un criterio');
                return;
            }

            try {
                const method = id ? 'PUT' : 'POST';
                if (id) datos.id = parseInt(id);

                const response = await fetch(`${API_BASE}/clientes`, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const result = await response.json();
                if (result.success) {
                    alert(result.mensaje);
                    cerrarModalCliente();
                    cargarClientes();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error al guardar');
            }
        }

        function editarCliente(id) {
            mostrarModalCliente(id);
        }

        async function eliminarCliente(id) {
            if (!confirm('¿Eliminar este cliente?')) return;
            try {
                const response = await fetch(`${API_BASE}/clientes?id=${id}`, { method: 'DELETE' });
                const result = await response.json();
                if (result.success) {
                    alert(result.mensaje);
                    cargarClientes();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function analizarLicitaciones() {
            const clienteId = document.getElementById('select-cliente').value;
            const fileInput = document.getElementById('file-input');

            if (!clienteId) { alert('Seleccione un cliente'); return; }
            if (!fileInput.files[0]) { alert('Seleccione un archivo Excel'); return; }

            const statusDiv = document.getElementById('analisis-status');
            statusDiv.innerHTML = '<div class="loading">Procesando...</div>';

            try {
                const file = fileInput.files[0];
                const arrayBuffer = await file.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                const descripciones = data.slice(1).map(row => row[2]).filter(desc => desc && desc.trim());

                if (descripciones.length === 0) {
                    alert('No hay descripciones en columna C');
                    return;
                }

                const LOTE_MAXIMO = 10;
                const totalLotes = Math.ceil(descripciones.length / LOTE_MAXIMO);

                statusDiv.innerHTML = `
                    <div class="progress-container">
                        <h3>📊 Procesando ${descripciones.length} descripciones en ${totalLotes} lotes</h3>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill" style="width: 0%">0%</div>
                        </div>
                        <div id="progress-details"></div>
                    </div>
                `;

                let todosLosResultados = [];
                let estadisticasAcumuladas = {
                    total: 0, descartadas_prefiltro: 0, analizadas_ia: 0,
                    alta: 0, media: 0, baja: 0, errores: 0
                };

                for (let i = 0; i < descripciones.length; i += LOTE_MAXIMO) {
                    const lote = descripciones.slice(i, Math.min(i + LOTE_MAXIMO, descripciones.length));
                    const numeroLote = Math.floor(i / LOTE_MAXIMO) + 1;

                    document.getElementById('progress-details').innerHTML = `
                        <div class="progress-stage">
                            <h4>Procesando lote ${numeroLote} de ${totalLotes}</h4>
                        </div>
                    `;

                    try {
                        const response = await fetch(`${API_BASE}/analizar-v4`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                cliente_id: parseInt(clienteId),
                                descripciones: lote,
                                guardar_en_db: true
                            })
                        });

                        const result = await response.json();

                        if (result.success) {
                            todosLosResultados.push(...result.resultados);
                            estadisticasAcumuladas.total += result.estadisticas.total;
                            estadisticasAcumuladas.descartadas_prefiltro += result.estadisticas.descartadas_prefiltro;
                            estadisticasAcumuladas.analizadas_ia += result.estadisticas.analizadas_ia;
                            estadisticasAcumuladas.alta += result.estadisticas.alta;
                            estadisticasAcumuladas.media += result.estadisticas.media;
                            estadisticasAcumuladas.baja += result.estadisticas.baja;

                            const progreso = Math.round((todosLosResultados.length / descripciones.length) * 100);
                            document.getElementById('progress-fill').style.width = progreso + '%';
                            document.getElementById('progress-fill').textContent = progreso + '%';

                            document.getElementById('progress-details').innerHTML = `
                                <div class="progress-stage">
                                    <h4>✅ Lote ${numeroLote} completado</h4>
                                    <p>Pre-filtro: ${result.estadisticas.descartadas_prefiltro} descartadas, ${result.estadisticas.analizadas_ia} analizadas</p>
                                </div>
                            `;
                        }

                        await new Promise(resolve => setTimeout(resolve, 500));

                    } catch (error) {
                        console.error(`Error lote ${numeroLote}:`, error);
                    }
                }

                statusDiv.innerHTML = `
                    <div class="stats">
                        <div class="stat-card"><h3>${estadisticasAcumuladas.total}</h3><p>Total</p></div>
                        <div class="stat-card"><h3>${estadisticasAcumuladas.descartadas_prefiltro}</h3><p>Pre-filtradas</p></div>
                        <div class="stat-card"><h3>${estadisticasAcumuladas.analizadas_ia}</h3><p>Analizadas IA</p></div>
                        <div class="stat-card"><h3>${estadisticasAcumuladas.alta}</h3><p>Alta</p></div>
                    </div>
                    <p style="text-align: center; color: green; font-weight: 600;">✅ Completado</p>
                `;

                setTimeout(() => document.querySelectorAll('.tab')[2].click(), 2000);

            } catch (error) {
                statusDiv.innerHTML = `<p style="color: red;">❌ Error: ${error.message}</p>`;
            }
        }

        async function cargarResultados() {
            const clienteId = document.getElementById('filtro-cliente').value;
            const relevancia = document.getElementById('filtro-relevancia').value;
            const container = document.getElementById('resultados-container');
            container.innerHTML = '<div class="loading">Cargando...</div>';

            try {
                let url = `${API_BASE}/resultados?limite=200`;
                if (clienteId) url += `&cliente_id=${clienteId}`;
                if (relevancia) url += `&relevancia=${relevancia}`;

                const response = await fetch(url);
                const data = await response.json();

                if (data.success) {
                    resultadosActuales = data.resultados;
                    mostrarResultados(data.resultados);
                    mostrarEstadisticas(data.resultados);
                }
            } catch (error) {
                container.innerHTML = '<p>Error cargando resultados</p>';
            }
        }

        function mostrarEstadisticas(resultados) {
            const alta = resultados.filter(r => r.relevancia === 'ALTA').length;
            const seleccionados = resultados.filter(r => r.seleccionado).length;

            document.getElementById('resultados-stats').innerHTML = `
                <div class="stat-card"><h3>${resultados.length}</h3><p>Total</p></div>
                <div class="stat-card"><h3>${alta}</h3><p>Alta</p></div>
                <div class="stat-card"><h3>${seleccionados}</h3><p>Seleccionados</p></div>
            `;
        }

        function mostrarResultados(resultados) {
            const container = document.getElementById('resultados-container');
            if (resultados.length === 0) {
                container.innerHTML = '<p>No hay resultados</p>';
                return;
            }

            container.innerHTML = `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>✅</th>
                                <th>Cliente</th>
                                <th>Descripción</th>
                                <th>Qué</th>
                                <th>Quién</th>
                                <th>Relevancia</th>
                                <th>Razón</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${resultados.map(r => `
                                <tr>
                                    <td><input type="checkbox" ${r.seleccionado ? 'checked' : ''} onchange="toggleSeleccion(${r.id}, this.checked)"></td>
                                    <td>${r.cliente_nombre}</td>
                                    <td>${r.descripcion}</td>
                                    <td>${r.que}</td>
                                    <td>${r.quien}</td>
                                    <td><span class="badge badge-${r.relevancia.toLowerCase()}">${r.relevancia}</span></td>
                                    <td>${r.razon}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        async function toggleSeleccion(id, seleccionado) {
            try {
                await fetch(`${API_BASE}/resultados`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, seleccionado })
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function exportarSeleccionados() {
            const seleccionados = resultadosActuales.filter(r => r.seleccionado);
            if (seleccionados.length === 0) {
                alert('No hay seleccionados');
                return;
            }

            const datos = seleccionados.map(r => ({
                'Cliente': r.cliente_nombre,
                'Descripción': r.descripcion,
                'Qué': r.que,
                'Quién': r.quien,
                'Relevancia': r.relevancia,
                'Razón': r.razon
            }));

            const ws = XLSX.utils.json_to_sheet(datos);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Seleccionados');
            XLSX.writeFile(wb, `licitaciones_${Date.now()}.xlsx`);
        }
    </script>
</body>
</html>
